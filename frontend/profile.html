<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker - Settings</title>
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-wallet"></i> SmartExpense
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="expenses.html" class="nav-item">
                    <i class="fas fa-receipt"></i> Expenses
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i> Analytics
                </a>
                <a href="profile.html" class="nav-item active">
                    <i class="fas fa-cog"></i> Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-btn" class="nav-item" style="color: var(--danger-color);">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Navbar -->
            <header class="navbar">
                <div class="navbar-left">
                    <button class="sidebar-toggle" id="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 style="margin-bottom: 0;">Settings</h2>
                </div>
                <div class="navbar-right">
                    <button class="theme-toggle" id="theme-toggle">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="user-profile">
                        <div class="avatar">AJ</div>
                        <div class="user-info">
                            <h4 class="user-name">User</h4>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <div class="charts-grid" style="grid-template-columns: 1fr 1fr;">
                    
                    <!-- Profile Info -->
                    <div class="glass-card">
                        <h3 class="mb-4">Profile Information</h3>
                        <form id="profile-form">
                            <div class="d-flex align-items-center gap-2 mb-4">
                                <div class="avatar" style="width: 80px; height: 80px; font-size: 2rem;">AJ</div>
                            </div>
                            
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" class="form-control" id="profile-name" value="Alex Johnson">
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" class="form-control" id="profile-email" value="alex@example.com">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>

                    <!-- App Settings -->
                    <div class="glass-card">
                        <h3 class="mb-4">Preferences</h3>
                        <form id="settings-form">
                            <div class="form-group">
                                <label>Currency Symbol</label>
                                <select id="currency-select" class="form-control">
                                    <option value="$">USD ($)</option>
                                    <option value="€">EUR (€)</option>
                                    <option value="£">GBP (£)</option>
                                    <option value="₹">INR (₹)</option>
                                    <option value="¥">JPY (¥)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Default Theme</label>
                                <select id="theme-select" class="form-control">
                                    <option value="dark">Dark Mode</option>
                                    <option value="light">Light Mode</option>
                                </select>
                            </div>

                            
                            <button type="submit" class="btn btn-primary">Update Preferences</button>
                        </form>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (!user) return; // Middleware will handle redirect

            // Populate data
            document.getElementById('profile-name').value = user.name;
            document.getElementById('profile-email').value = user.email;
            document.getElementById('currency-select').value = user.settings.currency;
            document.getElementById('theme-select').value = user.settings.theme;

            // Handle Profile Save
            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                user.name = document.getElementById('profile-name').value;
                user.email = document.getElementById('profile-email').value;
                try {
                    await updateSettings({ name: user.name, email: user.email });
                    
                    const btn = e.target.querySelector('button');
                    btn.innerHTML = '<i class="fas fa-check"></i> Saved!';
                    setTimeout(() => btn.innerHTML = 'Save Changes', 2000);

                    // Update UI elements
                    document.querySelectorAll('.user-name').forEach(el => el.textContent = user.name);
                } catch (err) {
                    alert('Error saving profile');
                }
            });

            // Handle Settings Save
            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                user.settings.currency = document.getElementById('currency-select').value;
                const newTheme = document.getElementById('theme-select').value;
                user.settings.theme = newTheme;
                
                try {
                    await updateSettings({ currency: user.settings.currency, theme: user.settings.theme });

                    // Apply theme immediately if changed
                    document.body.setAttribute('data-theme', newTheme);
                    
                    const btn = e.target.querySelector('button');
                    btn.innerHTML = '<i class="fas fa-check"></i> Updated!';
                    setTimeout(() => btn.innerHTML = 'Update Preferences', 2000);
                } catch (err) {
                    alert('Error updating settings');
                }
            });
        });
    </script>
</body>
</html>
