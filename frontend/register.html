<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker - Register</title>
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">
    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="logo">
                <i class="fas fa-wallet"></i> SmartExpense
            </div>
            
            <h2 class="mb-1">Create an Account</h2>
            <p class="text-muted mb-4">Start tracking your expenses today</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Alex Johnson" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>

                <div class="form-group mb-4">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </form>

            <p class="text-muted" style="margin-top: 2rem;">
                Already have an account? <a href="index.html" class="text-gradient" style="font-weight: 600;">Sign in here</a>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const pwd = document.getElementById('password').value;
            const confirmPwd = document.getElementById('confirm-password').value;

            if (pwd !== confirmPwd) {
                alert('Passwords do not match!');
                return;
            }

            setTimeout(async () => {
                try {
                    await registerUser(name, email, pwd);
                    window.location.href = 'onboarding.html';
                } catch (err) {
                    alert(err.message);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }, 1000);
        });
    </script>
</body>
</html>
